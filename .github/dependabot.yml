# Dependabot version updates: weekly, minor and patch updates grouped into one PR per ecosystem.
# Security updates are on separately (repo settings). Added by homesync, 2026-10-25.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # networkx 3.7+ requires Python >= 3.12; the app and CI run on 3.11.
      # Drop this when moving to Python 3.12.
      - dependency-name: networkx
        versions: [">=3.7"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
